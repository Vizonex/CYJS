[project]
name = "cyjs"
dynamic = ["version"]
description = "A Next Generation QuickJS Intrepreter for cython & python"
readme = "README.md"
authors = [
    { name = "Vizonex", email = "VizonexBusiness@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "cython"]

[tool.cibuildwheel]
build-frontend = "build"

[build-system]
requires = ["setuptools", "cython", "wheel"]


[tool.setuptools]
zip-safe = false
packages = ['cyjs']

[tool.setuptools.dynamic]
version = {attr = "cyjs.__version__"}

[project.urls]
    repository = "https://github.com/Vizonex/cyjs.git"
